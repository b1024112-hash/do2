
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海のIoT 1014930</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0 auto;
      padding: 24px 16px;
      max-width: 1100px;
      color: #1f2937;
      background: #f3f7fb;
    }
    h1 { font-size: 1.6rem; }
    .panel {
      background: white;
      padding: 18px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }
    .metric {
      background: #edf5fa;
      padding: 14px;
      border-radius: 8px;
    }
    .metric span { color: #526579; font-size: .9rem; }
    .metric strong {
      display: block;
      font-size: 1.3rem;
      margin-top: 8px;
      overflow-wrap: anywhere;
    }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid #e5eaf0;
      white-space: nowrap;
    }
    th { background: #edf5fa; }
    button {
      padding: 9px 14px;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #1769aa;
      color: white;
    }
    .muted { color: #667085; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>海のIoT <small>1014930</small></h1>

  <section class="panel">
    <h2>最新データ</h2>
    <div class="cards">
      <div class="metric">
        <span>緯度</span>
        <strong id="lat">--</strong>
      </div>
      <div class="metric">
        <span>経度</span>
        <strong id="lon">--</strong>
      </div>
      <div class="metric">
        <span>水温</span>
        <strong id="temp">--</strong>
      </div>
      <div class="metric">
        <span>塩分濃度（要確認）</span>
        <strong id="salinity">--</strong>
      </div>
    </div>
    <p id="status" class="muted">データ取得中...</p>
    <p id="checked" class="muted"></p>
    <button id="refresh">今すぐ更新</button>
  </section>

  <section class="panel">
    <h2>受信履歴</h2>
    <p class="muted">最新のデータが上に表示されます。</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>日時</th>
            <th>緯度</th>
            <th>経度</th>
            <th>水温 (℃)</th>
            <th>塩分濃度*</th>
            <th>RSSI</th>
            <th>Payload</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="7">取得中...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <script>
    const API =
      "https://api.buoy.jp/sakura/table.php?lfourId=1014930";
    const UPDATE_MS = 30000;
    let loading = false;

    // 4バイトずつ、float32のリトルエンディアンとして解釈
    function decodePayload(payload) {
      if (!/^[0-9a-fA-F]{32}$/.test(payload)) {
        throw new Error("Payloadは16バイトの16進数である必要があります");
      }

      const bytes = new Uint8Array(
        payload.match(/../g).map(b => parseInt(b, 16))
      );
      const view = new DataView(bytes.buffer);
      const values = [];

      for (let offset = 0; offset < 16; offset += 4) {
        values.push(view.getFloat32(offset, true));
      }

      const [lat, lon, temp, salinity] = values;

      if (!Number.isFinite(lat) || lat < -90 || lat > 90)
        throw new Error("緯度が不正です");
      if (!Number.isFinite(lon) || lon < -180 || lon > 180)
        throw new Error("経度が不正です");
      if (![temp, salinity].every(Number.isFinite))
        throw new Error("数値を読み取れません");

      return { lat, lon, temp, salinity };
    }

    // APIのHTMLテーブルから受信データを抽出
    function parseHTML(html) {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const result = [];

      for (const tr of doc.querySelectorAll("table tr")) {
        const cells = [...tr.querySelectorAll("th, td")]
          .map(td => td.textContent.trim());

        // Payloadは16進数32文字
        const payload = cells.find(v => /^[0-9a-fA-F]{32}$/.test(v));
        if (!payload) continue;

        // 例：2026-10-09、17:30:02
        const date = cells.find(v => /^\d{4}-\d{2}-\d{2}$/.test(v));
        const time = cells.find(v => /^\d{2}:\d{2}:\d{2}$/.test(v));
        const rssi = cells[cells.findIndex(v => v === payload) + 1];

        if (!date || !time) continue;

        result.push({
          datetime: `${date} ${time}`,
          payload,
          rssi: rssi ?? "",
          ...decodePayload(payload)
        });
      }

      return result;
    }

    function fmt(value, digits = 6) {
      return Number(value).toFixed(digits);
    }

    function render(items) {
      const tbody = document.getElementById("rows");
      tbody.replaceChildren();

      for (const item of items) {
        const tr = document.createElement("tr");
        const values = [
          item.datetime,
          fmt(item.lat),
          fmt(item.lon),
          fmt(item.temp, 4),
          fmt(item.salinity, 4),
          item.rssi,
          item.payload
        ];

        for (const value of values) {
          const td = document.createElement("td");
          td.textContent = value;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }

      const latest = items[0];
      document.getElementById("lat").textContent = fmt(latest.lat);
      document.getElementById("lon").textContent = fmt(latest.lon);
      document.getElementById("temp").textContent =
        fmt(latest.temp, 4) + " °C";
      document.getElementById("salinity").textContent =
        fmt(latest.salinity, 4);
    }

    async function update() {
      if (loading) return;
      loading = true;
      document.getElementById("status").textContent = "取得中...";

      try {
        const response = await fetch(API, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const html = await response.text();
        const items = parseHTML(html);

        if (!items.length) {
          throw new Error("データが見つかりません。APIの形式を確認してください");
        }

        // 日時の降順
        items.sort((a, b) => b.datetime.localeCompare(a.datetime));
        render(items);

        document.getElementById("status").textContent =
          `取得成功：${items.length}件`;
      } catch (error) {
        document.getElementById("status").textContent =
          "取得エラー：" + error.message +
          "（CORSまたはAPI形式を確認してください）";
      } finally {
        document.getElementById("checked").textContent =
          "最終確認：" + new Date().toLocaleString("ja-JP");
        loading = false;
      }
    }

    document.getElementById("refresh").addEventListener("click", update);
    update();
    setInterval(update, UPDATE_MS);
  </script>
</body>
</html>
